      setVoiceStatus(MUTED_BY_URL ? 'muted' : 'idle', 'spoken answers off');
    } else if (MUTED_BY_URL){
      setVoiceStatus('muted', '?mute=1 \u00b7 nothing in this tab will speak');
    } else {
      setVoiceStatus('idle', 'spoken answers on');
      speak('Spoken answers on.');
    }
  });
}
/* ------------------------------------------------------------ the brain UI */
const form = $('ask-form'), input = $('q'), send = $('send');
const answerBox = $('answer'), answerText = $('answer-text'),
      answerSrc = $('answer-sources'), answerFoot = $('a-foot'), answerModel = $('a-model');

function showAnswer(){ answerBox.hidden = false; }

/* The boot greeting: the line comes from the server (persona + the real note count),
   and it is spoken like anything else - which means before the first click it waits in
   pendingSpeech and is heard the moment the page is touched, and in a ?mute=1 tab it is
   never spoken at all. It is shown straight away either way. */
let greeted = false;
function greet(line){
  const text = String(line || '').trim();
  if (!text || greeted) return;
  greeted = true;
  answerText.className = 'greeting';
  answerText.textContent = text;
  answerSrc.innerHTML = '';
  answerModel.textContent = '';
  answerFoot.textContent = 'ready when you are';
  showAnswer();
  speak(text);
}
function thinking(label){
  hideFrame();                     // the previous frame belongs to the previous answer
  answerText.className = 'thinking';
  answerText.textContent = label || 'reading your notes…';
  answerSrc.innerHTML = ''; answerFoot.textContent = ''; answerModel.textContent = '';
  showAnswer();
}
function renderAnswer(data, plan){
  answerText.className = '';
  answerText.textContent = data.answer || '(empty answer)';
  answerModel.textContent = data.model ? `· ${data.model}` : '';
  answerSrc.innerHTML = '';
  const primary = plan && plan.kind === 'single' ? plan.node : null;
  (data.nodes || []).forEach(idx => {
    const n = byIndex.get(idx);
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'src' + (n === primary ? ' primary' : '');
    if (n === primary) b.title = 'the camera flew here';
    b.innerHTML = `<i style="background:${colorOf(n)}"></i>${esc(n.label)}<span class="idx">#${idx}</span>`;
    b.onclick = () => setFocus(n);
    answerSrc.appendChild(b);
  });
  const bits = [];
  // what the answer came from, said plainly - and how many notes it was shown
  const used = (data.nodes || []).length;
  if (data.decision === 'screen'){
    // a screen answer: say so, with the frame it came from. The galaxy lit nothing,
    // because nothing in it was the source.
    bits.push('from the screen');
    if (data.frame){
      bits.push(`${data.frame.width}\u00d7${data.frame.height}`);
      bits.push(`${Math.max(1, Math.round((data.frame.bytes || 0) / 1024))} KB`);
    }
    bits.push('no notes used');
  }
  else if (data.on_notes === false) bits.push('no notes used');
  else if (used) bits.push(`from ${used} note${used === 1 ? '' : 's'}`);
  else bits.push('no notes matched');
  if (data.read && data.read.length) bits.push(`read ${data.read.length}`);
  if (data.turns != null) bits.push(`memory ${data.turns} turn${data.turns === 1 ? '' : 's'}`);
  if (data.model) bits.push(data.model);
  answerFoot.textContent = bits.join(' · ');
  showAnswer();
}
function renderError(msg, hint){
  answerText.className = 'error';
  answerText.textContent = msg + (hint ? '\n\n' + hint : '');
  answerSrc.innerHTML = ''; answerModel.textContent = ''; answerFoot.textContent = '';
  showAnswer();
}
$('a-close').onclick = () => { answerBox.hidden = true; };

/* --------------------------------------------------- where an answer came from
   The order of these two functions IS the feature, so keep it:

     answerSource(data)      decide what the answer came from - pure, no side effects,
                             nothing in here may touch the camera or the lights
     showAnswerSource(plan)  only then act on that decision

   Small talk never reaches the camera, because the server sends it back with no
   sources at all and on_notes: false - the decision is made and is "still". That is
   what stops "good morning" from dragging the view across the galaxy. */
function answerSource(data){
  const nodes = (Array.isArray(data && data.nodes) ? data.nodes : [])
    .map(i => byIndex.get(i))
    .filter(Boolean);
  const usedNotes = !data || data.on_notes !== false;   // an older server says nothing: trust its list
  const empty = {kind: 'still', nodes: [], why: !usedNotes ? 'small talk' : 'no notes used'};
  if (!usedNotes || !nodes.length) return empty;
  if (nodes.length >= PROVENANCE_FLY_MAX + 1)
    return {kind: 'cluster', nodes, why: nodes.length + ' notes'};
  return {kind: 'single', node: nodes[0], nodes, why: '1 note'};
}

function showAnswerSource(plan){
  if (!plan || plan.kind === 'still') return;      // the galaxy holds perfectly still
  if (plan.kind === 'single'){
    // the whole answer: fly to it, light it and everything it is joined to, open it
    setFocus(plan.node);
    return;
  }
  // four or more notes: light the cluster itself, move nothing. The side panel names
  // exactly one note, which is not what happened here, so it closes.
  selected = null;
  domainNodes = null;
  closePanel();
  litIds = new Set(plan.nodes.map(n => n.id));
  litPair = new Set();
  for (let i = 0; i < plan.nodes.length; i++){
    for (let j = i + 1; j < plan.nodes.length; j++){
      const a = plan.nodes[i], b = plan.nodes[j];
      if ((adj.get(a.id) || []).some(e => e.node === b)) litPair.add(a.id + '|' + b.id);
    }
  }
  repaintNodes();
}

/* The spoken version of an answer: the answer, and never the note. Past
   SPEAK_MAX_CHARS it is cut at a sentence end - the rest is on screen, and reading
   a note aloud is exactly what this must not do. */
function spokenText(answer){
  const full = String(answer == null ? '' : answer).trim();
  if (full.length <= SPEAK_MAX_CHARS) return {text: full, trimmed: false};
  const head = full.slice(0, SPEAK_MAX_CHARS);
  const cut = Math.max(head.lastIndexOf('. '), head.lastIndexOf('! '), head.lastIndexOf('? '));
  if (cut < SPEAK_MAX_CHARS * 0.4) return {text: full, trimmed: false};   // one long sentence: read it
  return {text: head.slice(0, cut + 1).trim(), trimmed: true};
}

/* A capture, on screen. The line comes from the server (persona + the real facts of
   where the note landed), and the footer says where the file is - including the
   honest note that the graph file has not caught up with it yet. */
function renderCapture(data, ok){
  answerText.className = 'captured' + (ok ? '' : ' failed');
  answerText.textContent = data.line || data.answer || (ok ? 'Filed.' : 'It did not go in.');
  answerModel.textContent = '';
  answerSrc.innerHTML = '';
  if (ok){
    const bits = ['filed'];
    if (data.file) bits.push(data.file);
    if (data.date) bits.push(data.date);
    if (data.node) bits.push(`${data.notes} notes, ${(data.node.degree || 0)} links`);
    if (data.graph_file === 'behind') bits.push('run python3 build.py to write it into graph-data.js');
    answerFoot.textContent = bits.join(' \u00b7 ');
  } else {
    answerFoot.textContent = data.hint || '';
  }
  showAnswer();
}

/* "remember that ..." - the other half of the ask bar. It writes a real note, and
   then the galaxy grows: born at the note it is most related to, a brief glow, and
   only then the camera. A failure is never silent - it is shown AND spoken. */
async function submitCapture(sentence){
  send.disabled = true;
  thinking('writing it down\u2026');
  setVoiceStatus('thinking', 'writing it down\u2026');
  answerBox.hidden = false;
  try {
    const res = await fetch('/remember', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: sentence})
    });
    let data = {};
    try { data = await res.json(); } catch (_){}
    const ok = res.ok && data.ok !== false && data.captured !== false;
    if (!ok){
      lastSourcePlan = {kind: 'still', nodes: [], why: 'the capture did not land'};
      renderCapture(data, false);
      await speak(data.line || data.answer || data.error ||
                  `The brain returned HTTP ${res.status}.`);
      return;
    }
    renderCapture(data, true);
    lastSourcePlan = {kind: 'capture', nodes: [], why: 'a new note was filed', node: data.node};
    const born = addCaptureNode(data);
    input.value = '';                         // the thought is filed; the bar is free again
    speak(data.line || data.answer);          // the confirmation, out loud
    const pulse = await birthPulse(born);     // born, then a brief glow...
    setFocus(born.node);                      // ...then the camera goes to it
    // Let the layout have it only now: the star was pinned where it was born, and
    // once the camera is on its way it becomes an ordinary citizen of the galaxy.
    setTimeout(() => {
      born.node.fx = born.node.fy = born.node.fz = undefined;
      if (born.anchor) born.anchor.fx = born.anchor.fy = born.anchor.fz = undefined;
    }, CFG.flyMs);
    lastBirth = {id: born.node.id, label: born.node.label,
                 anchor: born.anchor ? born.anchor.id : null, at: born.at,
                 spawn: lastSpawn,
                 pulseMs: CAPTURE_PULSE_MS, pulseEndedAt: pulse.endedAt,
                 flewAt: lastFlyTo ? lastFlyTo.at : null, file: data.file || '',
                 pinned: () => born.node.fx !== undefined};
  } catch (err){
    lastSourcePlan = {kind: 'still', nodes: [], why: 'the capture did not land'};
    renderCapture({line: 'It did not go in, sir - I could not reach the server.'}, false);
    await speak('I could not reach the server, sir, so nothing was written.');
  } finally {
    send.disabled = false;
    resumeIfHandsFree();
    input.focus();
  }
}

let lastSourcePlan = null;      // what the last answer was judged to have come from
let lastBirth = null;           // where the last capture was born and when it flew

/* ---------------------------------------------------------------------------
   a question about the screen
   --------------------------------------------------------------------------- */
function showFrame(frame, ok){
  const box = $('a-frame'), img = $('frame-shot'), meta = $('frame-meta');
  if (!box || !img || !meta) return;
  if (!frame || !frame.dataUrl){ box.hidden = true; img.removeAttribute && img.removeAttribute('src'); return; }
  img.src = frame.dataUrl;                     // the exact frame that was sent
  const when = frame.at ? new Date(frame.at) : new Date();
  const stamp = [when.getHours(), when.getMinutes(), when.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  // the type is the one the browser produced; the server names the same value in its
  // own vocabulary (media_type), so both spellings are understood here
  const type = frame.mediaType || frame.media_type || '';
  meta.textContent = (ok ? 'the frame I looked at' : 'the frame I could not look at') +
    '\n' + frame.width + '\u00d7' + frame.height + ' ' +
    type.replace('image/', '').toUpperCase() +
    ' \u00b7 ' + Math.max(1, Math.round((frame.bytes || 0) / 1024)) + ' KB \u00b7 taken at ' + stamp +
    (frame.source && frame.source.width > frame.width
      ? '\nscaled down from ' + frame.source.width + '\u00d7' + frame.source.height : '');
  box.hidden = false;
}
function hideFrame(){
  const box = $('a-frame');
  if (box) box.hidden = true;
}

/* One line, shown and spoken, when there is no screen to look at. Never a guess. */
async function sayNoScreen(line, detail){
  answerText.className = 'error';
  answerText.textContent = line;
  answerModel.textContent = ''; answerSrc.innerHTML = '';
  answerFoot.textContent = detail || '';
  hideFrame();
  showAnswer();
  await speak(line);
}

async function submitScreen(question, options){
  const opts = options || {};
  // The share has to be live AT THIS MOMENT. If it is not, no frame is taken, nothing
  // is sent, and he says so - a screen question is never answered from an earlier
  // frame, or from a screen share that is over.
  if (!sightIsSharing()){
    input.value = '';                  // the question has been answered; the bar is free
    lastSourcePlan = {kind: 'still', nodes: [], why: 'no live screen share'};
    const line = opts.reason === 'ended'
      ? (sightLines.ended || 'The screen share has ended, sir.')
      : (sightLines.never || 'I have not been shown your screen, sir.');
    await sayNoScreen(line, opts.reason === 'ended'
      ? 'the share is over - press the screen button to look again'
      : 'nothing is being shared - press the screen button to show him');
    return;
  }
  send.disabled = true;
  thinking('looking at your screen\u2026');
  setVoiceStatus('thinking', 'taking one frame\u2026');
  answerBox.hidden = false;
  const askedAt = Date.now();
  try {
    const grabbed = await grabFrame();            // taken here, at the moment you asked
    if (!grabbed.ok){
      lastSourcePlan = {kind: 'still', nodes: [], why: 'no frame'};
      const line = sightLines.grab_failed || 'I could not take a picture of your screen, sir.';
      await sayNoScreen(line, 'no frame was taken (' + grabbed.why + ') - nothing was sent');
      return;
    }
    const frame = grabbed.frame;
    lastFrameSent = frame;
    input.value = '';                  // the question is on its way; the bar is free again
    const res = await fetch('/see', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: question,
        image: frame.dataUrl,                     // self-describing: the type travels with the bytes
        media_type: frame.mediaType,
        width: frame.width, height: frame.height,
        asked_at: askedAt, captured_at: frame.capturedAt
      })
    });
    let data = {};
    try { data = await res.json(); } catch (_){}
    if (!res.ok || data.ok === false || data.error){
      lastSourcePlan = {kind: 'still', nodes: [], why: 'no answer'};
      renderError(data.error || `The brain returned HTTP ${res.status}.`, data.hint || '');
      showFrame(data.frame ? Object.assign({at: frame.capturedAt}, frame, data.frame) : frame, false);
      await speak(data.answer || data.error || 'I could not reach the server.');
      return;
    }
    // the same answer path as everything else: decide, render, then speak
    const plan = answerSource(data);              // on_notes is false: the galaxy holds still
    lastSourcePlan = plan;
    renderAnswer(data, plan);
    showFrame(Object.assign({at: frame.capturedAt}, frame, data.frame || {}), true);
    if (data.model) answerModel.textContent = data.model ? `\u00b7 ${data.model}` : '';
    const spoken = spokenText(data.answer || '');
    await speak(spoken.text, spoken.trimmed ? 'the short version - the rest is on screen' : '');
  } catch (err){
    lastSourcePlan = {kind: 'still', nodes: [], why: 'no answer'};
    renderError('Could not reach the server.', String(err));
    await speak('I could not reach the server, sir - nothing was looked at.');
  } finally {
    send.disabled = false;
    resumeIfHandsFree();
    input.focus();
  }
}

/* ---------------------------------------------------------------------------
   the brain chip, and changing which brain answers

   Every string here is built by the server: the label, the id, and whether this is a
   runtime swap. The page does not own a single model name, so the chip and the answer
   footer can never disagree with what was actually called.

   A refusal is not an error to swallow: the server sends refused: true, the line it
   sends names what he does have, and it is shown AND spoken while the chip stays on
   the brain that is really in the chair.
   --------------------------------------------------------------------------- */
function paintBrain(data){
  const chip = $('brain-chip'), label = $('brain-label');
  if (!chip || !label) return;
  const id = data.model || '';
  label.textContent = data.label || data.model_label || (id ? id.split('/').pop() : '\u2014');
  chip.classList.toggle('swapped', !!data.swapped);
  const temp = $('brain-temp');
  if (temp) temp.hidden = !data.swapped;
  const parts = ['answering with ' + (id || 'the model in config.json')];
  if (data.swapped) parts.push('swapped at runtime - a restart returns to ' +
    (data.config_model || 'the model in config.json'));
  parts.push('say \u201cswitch to \u2026\u201d to change it');
  chip.title = parts.join(' \u00b7 ');
}
function flashBrain(){
  const chip = $('brain-chip');
  if (!chip || !chip.classList) return;
  chip.classList.remove('flash');
  void chip.offsetWidth;                 // restart the animation, if there is one
  chip.classList.add('flash');
  setTimeout(() => chip.classList.remove('flash'), 1700);
}

/* The words that mean "change which brain you are wearing". This is only the ROUTING
   decision - what the words actually mean is decided by the server, in one place. A
   question that merely mentions a model is not a command: it must start with one of
   these verbs, must not be a question, and the weak verbs (use / be / try) need a name
   the catalogue actually has, so "use the movers quote" stays a question. */
const BRAIN_VERB = /^\s*(?:please\s+)?(?:switch|swap|change|turn|put\s+on|wear|become|try(?:\s+(?:on|out))?|be|use|go\s+back|back|revert|reset|return)\b/i;
const BRAIN_WEAK_VERB = /^\s*(?:please\s+)?(?:use|be|become|try)\b/i;
const BRAIN_QUESTION = /^\s*(?:what|which|who|when|where|why|how|is|are|was|were|do|does|did|can|could|would|will|should|tell|show|explain)\b/i;
function namesABrain(text){
  if (!brainCatalog.length) return true;      // catalogue not loaded yet: let the server say
  const low = text.toLowerCase();
  return brainCatalog.some(b => b && b.name && new RegExp('\\b' + b.name + '\\b').test(low));
}
function isBrainCommand(text){
  const t = String(text || '').trim();
  if (!t || t.length > 90 || t.indexOf('?') >= 0) return false;
  if (/^\s*(?:your\s+)?(?:normal|default|usual|original)\s+brain\s*$/i.test(t)) return true;
  if (BRAIN_QUESTION.test(t)) return false;
  if (t.split(/\s+/).length > 9) return false;
  if (!BRAIN_VERB.test(t)) return false;
  if (!BRAIN_WEAK_VERB.test(t)) return true;  // switch / swap / change / go back are unambiguous
  return namesABrain(t);
}

async function submitBrain(said){
  send.disabled = true;
  thinking('changing brains\u2026');
  setVoiceStatus('thinking', 'changing brains\u2026');
  answerBox.hidden = false;
  try {
    const res = await fetch('/model', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: said})
    });
    let data = {};
    try { data = await res.json(); } catch (_){}
    if (!res.ok || data.error){
      lastSourcePlan = {kind: 'still', nodes: [], why: 'the brain was not changed'};
      renderError(data.error || `The server returned HTTP ${res.status}.`, data.hint || '');
      await speak(data.answer || data.error || 'I could not do that, sir.');
      return;
    }
    input.value = '';                    // the command has been dealt with; the bar is free
    paintBrain(data);                    // the chip first: it is the thing you are watching
    lastSourcePlan = {kind: 'still', nodes: [], why: 'no notes in this'};
    renderBrain(data);
    if (data.changed) flashBrain();
    await speak(data.answer || data.spoken || '');
  } catch (err){
    lastSourcePlan = {kind: 'still', nodes: [], why: 'the brain was not changed'};
    renderError('Could not reach the server.', String(err));
    await speak('I could not reach the server, sir, so nothing was changed.');
  } finally {
    send.disabled = false;
    resumeIfHandsFree();
    input.focus();
  }
}

/* The answer card, for a swap or a refusal. A refusal says so in the footer, in plain
   words, so nobody can read a refusal as a success. */
function renderBrain(data){
  answerText.className = data.refused ? 'brain refused' : 'brain';
  answerText.textContent = data.answer || '';
  answerModel.textContent = data.model ? `\u00b7 ${data.model}` : '';
  answerSrc.innerHTML = '';
  hideFrame();
  const bits = [];
  if (data.refused) bits.push('NOT CHANGED');
  if (data.swapped) bits.push('swapped until the next restart');
  else bits.push('the brain in config.json');
  if (data.refused && (data.have || []).length) bits.push('have: ' + data.have.join(' / '));
  else if (data.model) bits.push(data.model);
  if (data.turns != null) bits.push(`memory ${data.turns} turn${data.turns === 1 ? '' : 's'}`);
  answerFoot.textContent = bits.join(' \u00b7 ');
  showAnswer();
}

/* One path for both input methods: a typed question and a spoken one go through
   exactly the same /chat flow, and every answer is spoken. */
async function submitQuestion(question){
  question = String(question || '').trim();
  if (!question || send.disabled) return;
  // The decisions, in order, before anything else happens.
  // 1. "switch to astra" is a command about WHICH brain answers - not a question about
  //    the notes and not a question about the screen. It is decided first of all, so a
  //    brain swap works whatever else is going on, including during a screen share.
  if (isBrainCommand(question)) return submitBrain(question);
  // 2. "remember that ..." is a note, not a question - it goes to /remember.
  if (isRemember(question)) return submitCapture(question);
  // 3. while a share is live, EVERY question is about the screen: it carries one frame
  //    taken right now and goes to /see. No keyword guessing while sharing, so a
  //    screen question can never be answered from the notes by mistake.
  if (shareState === 'live') return submitScreen(question, {reason: 'sharing'});
  // 4. nothing is being shared and the question is plainly pointing at a screen: he says
  //    so instead of answering it from the notes. "The share has ended" if he was looking
  //    at your screen a moment ago, "I have not been shown your screen" otherwise - and
  //    after the window has passed it is a normal question again, because a session that
  //    ended ten minutes ago is not what you are asking about.
  if (screenQuestion(question)){
    const justEnded = shareState === 'ended' &&
                      (performance.now() - shareEndedAt) < SIGHT_ENDED_WINDOW_MS;
    if (justEnded) return submitScreen(question, {reason: 'ended'});
    if (shareState === 'off') return submitScreen(question, {reason: 'never'});
  }
  send.disabled = true;
  thinking();
  setVoiceStatus('thinking', 'reading your notes\u2026');
  answerBox.hidden = false;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    let data = {};
    try { data = await res.json(); } catch (_){}
    if (!res.ok || data.error){
      const message = data.error || `The brain returned HTTP ${res.status}.`;
      // no answer came back, so there is nothing to prove: hold the galaxy still
      lastSourcePlan = {kind: 'still', nodes: [], why: 'no answer'};
      renderError(message, data.hint || '');
      await speak(message);
    } else {
      // 1. decide what this answer came from   2. act on it   3. speak
      const plan = answerSource(data);
      lastSourcePlan = plan;
      renderAnswer(data, plan);
      showAnswerSource(plan);        // the camera flies while the answer is being spoken
      input.value = '';
      const spoken = spokenText(data.answer || '');
      await speak(spoken.text, spoken.trimmed ? 'the short version - the rest is on screen' : '');
    }
  } catch (err){
    renderError('Could not reach the server.', String(err));
    await speak('I could not reach the server.');
  } finally {
    send.disabled = false;
    resumeIfHandsFree();
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  // typing is not a hands-free turn: close the mic so it cannot hear Alfred's answer
  resumeListeningAfterSpeech = false;
  if (wantListening || listening) stopListening('typed');
  submitQuestion(input.value);
});

/* rotating placeholder drawn from the actual note titles */
(function rotatePlaceholder(){
  let i = Math.floor(Math.random() * Math.max(1, NODES.length));
  setInterval(() => {
    if (document.activeElement === input || input.value || !NODES.length) return;
    // while a screen share is live the placeholder belongs to the share: the note hints
    // must not quietly take over the one line that says what your next question is about
    if (shareState !== 'off'){ paintSight(); return; }
    i = (i + 1) % NODES.length;
    input.placeholder = `Ask about “${NODES[i].label}”…`;
  }, 5200);
})();

/* ------------------------------------------------------------------ start */
boot3d().catch(err => {
  console.error('[alfred] boot failed', err);
  boot.classList.remove('gone');
  const tried = (err && err.tried || []).map(u => '<code>' + esc(u) + '</code>').join(', ');
  bootMsg.innerHTML = 'The 3D layer could not start.<br><code>' + esc(err.message || err) + '</code>' +
    (tried ? '<br><br>Tried: ' + tried : '') +
    '<br><br>This page needs a WebGL-capable browser and one-time access to a CDN ' +
    '(cdn.jsdelivr.net). If your network blocks CDNs, run <code>python3 tools/vendor.py</code> ' +
    'once to keep a local copy, then reload. Details are in the browser console.';
  $('status').className = 'bad';
  $('status-text').textContent = 'boot failed';
});
</script>
