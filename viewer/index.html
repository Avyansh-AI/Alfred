<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred &middot; Knowledge Galaxy</title>
<meta name="description" content="A 3D knowledge galaxy of your markdown notes, with a brain you can talk to.">
<style>
  :root{
    --void:#03040a;
    --ink:#e9edf7;
    --dim:#8b95ad;
    --dimmer:#5b6478;
    --line:rgba(255,255,255,.09);
    --glass:rgba(10,14,26,.72);
    --glass-hi:rgba(20,26,44,.86);
    --accent:#6ee7ff;
    --warn:#ffc46b;
    --bad:#ff8f8f;
    --ok:#7bffc4;
    --r:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--void); color:var(--ink); font-family:var(--font);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed; inset:0}
  #stage canvas{display:block}
  /* cinematic vignette + subtle colour grade over the 3D layer */
  #grade{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(10,16,40,.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(6,10,24,.5) 100%);
  }
  /* the library's hover tooltip arrives as .float-tooltip-kap */
  .float-tooltip-kap{
    font-family:var(--font)!important; font-size:12px!important; line-height:1.5!important;
    color:var(--ink)!important; background:var(--glass-hi)!important;
    border:1px solid var(--line)!important; padding:7px 11px!important;
    border-radius:10px!important; backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.5)!important; letter-spacing:.2px;
  }
  .float-tooltip-kap b{font-weight:600}
  .float-tooltip-kap span{color:var(--dim)}

  /* ---------- top-left HUD ---------- */
  #hud{
    position:fixed; top:18px; left:18px; z-index:5; max-width:min(360px,46vw);
    padding:14px 16px 13px; border:1px solid var(--line); border-radius:var(--r);
    background:var(--glass); backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  #hud h1{
    margin:0; font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  }
  #hud h1 em{font-style:normal;color:var(--accent)}
  #stats{margin:6px 0 0; font-size:11.5px; color:var(--dim); letter-spacing:.03em}
  #status{
    display:inline-flex; align-items:center; gap:6px; margin-top:9px;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:3px 9px;
  }
  #status .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  #status.live .dot{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  #status.bad .dot{background:var(--bad); box-shadow:0 0 8px var(--bad)}
  #legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px;
    padding:3px 9px; background:rgba(255,255,255,.02); transition:.18s; user-select:none;
  }
  .chip:hover{color:var(--ink); border-color:rgba(255,255,255,.22)}
  .chip.on{color:var(--ink); border-color:rgba(255,255,255,.3); background:rgba(255,255,255,.06)}
  .chip i{width:7px;height:7px;border-radius:50%; display:inline-block; font-style:normal}
  .chip .n{color:var(--dimmer)}
  #hint{margin-top:10px; font-size:10.5px; color:var(--dimmer); line-height:1.5}
  #key-note{margin-top:9px; font-size:10.5px; color:var(--warn); line-height:1.5}
  #key-note[hidden]{display:none}
  kbd{
    font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:5px; padding:1px 4px; color:var(--dim);
  }

  /* ---------- side panel ---------- */
  #panel{
    position:fixed; top:0; right:0; z-index:6; height:100%; width:min(390px,92vw);
    background:linear-gradient(180deg, rgba(9,12,24,.95), rgba(6,9,18,.97));
    border-left:1px solid var(--line); backdrop-filter:blur(14px);
    transform:translateX(102%); transition:transform .5s cubic-bezier(.16,.8,.24,1);
    display:flex; flex-direction:column; box-shadow:-30px 0 70px rgba(0,0,0,.5);
  }
  #panel.open{transform:none}
  #panel-head{padding:20px 22px 14px; border-bottom:1px solid var(--line)}
  #panel-close{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--dim);
    font-size:15px; line-height:1; display:grid; place-items:center; transition:.18s;
  }
  #panel-close:hover{color:var(--ink); background:rgba(255,255,255,.09)}
  #panel-label{margin:0 34px 0 0; font-size:19px; font-weight:600; letter-spacing:-.01em; line-height:1.25}
  #panel-group{margin-top:9px; display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--dim)}
  #panel-group i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #panel-group code{font-family:var(--mono); font-size:10.5px; color:var(--dimmer)}
  #panel-body{padding:18px 22px 26px; overflow-y:auto; flex:1}
  #panel-excerpt{
    font-size:13.5px; line-height:1.72; color:#c6cddd; white-space:pre-wrap;
    border-left:2px solid rgba(110,231,255,.35); padding-left:14px; margin:0;
  }
  .p-section{margin-top:22px}
  .p-title{
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dimmer); margin-bottom:9px;
  }
  #panel-neighbours{display:flex; flex-direction:column; gap:6px}
  .neigh{
    display:flex; align-items:center; gap:9px; cursor:pointer; text-align:left;
    background:rgba(255,255,255,.025); border:1px solid var(--line); border-radius:10px;
    padding:8px 11px; color:var(--dim); font-size:12.5px; font-family:var(--font); transition:.18s;
  }
  .neigh:hover{color:var(--ink); background:rgba(255,255,255,.07); transform:translateX(2px)}
  .neigh i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .neigh .kind{margin-left:auto; font-family:var(--mono); font-size:9.5px; color:var(--dimmer)}
  #panel-meta{
    margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10.5px; color:var(--dimmer); line-height:1.7;
  }

  /* ---------- ask bar ---------- */
  #ask-wrap{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:7;
    width:min(760px,calc(100vw - 36px)); display:flex; flex-direction:column; gap:10px;
  }
  #answer{
    border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
    background:var(--glass); backdrop-filter:blur(12px); box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  #answer[hidden]{display:none}
  .a-head{
    display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line);
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dimmer);
  }
  .a-head .who{color:var(--accent)}
  .a-head button{
    margin-left:auto; background:none; border:0; color:var(--dimmer); cursor:pointer;
    font-size:14px; line-height:1; padding:2px 4px;
  }
  .a-head button:hover{color:var(--ink)}
  #answer-text{padding:14px 16px; font-size:13.5px; line-height:1.7; color:#d5dbe8; white-space:pre-wrap}
  #answer-text.thinking{color:var(--dim); font-style:italic}
  #answer-text.error{color:var(--warn)}
  #answer-sources{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 14px}
  #answer-sources:empty{display:none}
  .src{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:rgba(255,255,255,.03);
    font-family:var(--font); transition:.18s;
  }
  .src:hover{color:var(--ink); border-color:rgba(255,255,255,.25)}
  .src i{width:6px;height:6px;border-radius:50%;font-style:normal}
  .src .idx{font-family:var(--mono); font-size:9.5px; color:var(--dimmer)}
  .a-foot{padding:0 16px 12px; font-family:var(--mono); font-size:10px; color:var(--dimmer)}
  #ask-form{
    display:flex; align-items:center; gap:10px; padding:9px 9px 9px 16px;
    border:1px solid var(--line); border-radius:999px; background:var(--glass);
    backdrop-filter:blur(12px); box-shadow:0 18px 50px rgba(0,0,0,.55);
    transition:border-color .2s, box-shadow .2s;
  }
  #ask-form:focus-within{border-color:rgba(110,231,255,.45); box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 4px rgba(110,231,255,.07)}
  #ask-form .sig{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:0 0 auto}

  /* ---------- voice: status line, mic, speaker ---------- */
  #voice-status{
    display:inline-flex; align-items:center; gap:8px; align-self:center;
    font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
    background:var(--glass); border:1px solid var(--line); border-radius:999px;
    padding:5px 13px; backdrop-filter:blur(12px); max-width:100%;
    transition:border-color .25s, color .25s;
  }
  #voice-status .vs-dot{
    width:7px; height:7px; border-radius:50%; background:var(--dimmer); flex:0 0 auto;
    transition:background .25s, box-shadow .25s;
  }
  #voice-detail{
    text-transform:none; letter-spacing:.01em; color:var(--dimmer); font-size:10.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:38ch;
  }
  #voice-status[data-state="listening"]{color:var(--ok); border-color:rgba(123,255,196,.4)}
  #voice-status[data-state="listening"] .vs-dot{background:var(--ok); box-shadow:0 0 10px var(--ok); animation:vs-pulse 1.1s ease-in-out infinite}
  #voice-status[data-state="thinking"]{color:var(--warn); border-color:rgba(255,196,107,.4)}
  #voice-status[data-state="thinking"] .vs-dot{background:var(--warn); box-shadow:0 0 10px var(--warn); animation:vs-pulse .8s ease-in-out infinite}
  #voice-status[data-state="speaking"]{color:var(--accent); border-color:rgba(110,231,255,.45)}
  #voice-status[data-state="speaking"] .vs-dot{background:var(--accent); box-shadow:0 0 10px var(--accent); animation:vs-pulse 1.4s ease-in-out infinite}
  #voice-status[data-state="muted"]{color:#b9a6ff; border-color:rgba(185,166,255,.4)}
  #voice-status[data-state="muted"] .vs-dot{background:#b9a6ff; box-shadow:0 0 10px #b9a6ff}
  #voice-status[data-state="error"]{color:var(--bad); border-color:rgba(255,143,143,.4)}
  #voice-status[data-state="error"] .vs-dot{background:var(--bad); box-shadow:0 0 10px var(--bad)}
  @keyframes vs-pulse{0%,100%{transform:scale(1); opacity:.95}50%{transform:scale(1.35); opacity:1}}

  #mic, #speak-toggle{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center; color:var(--dim);
    background:rgba(255,255,255,.04); border:1px solid var(--line); transition:.18s;
  }
  #mic:hover, #speak-toggle:hover{color:var(--ink); background:rgba(255,255,255,.1)}
  #mic[aria-pressed="true"]{
    color:#04121a; background:var(--ok); border-color:var(--ok);
    box-shadow:0 0 0 4px rgba(123,255,196,.16), 0 0 18px rgba(123,255,196,.5);
  }
  #speak-toggle[aria-pressed="false"]{color:var(--dimmer); opacity:.6}
  #speak-toggle[aria-pressed="false"] .wave{display:none}
  #speak-toggle[aria-pressed="true"]{color:var(--accent); border-color:rgba(110,231,255,.3)}
  #ask-form.unsupported #mic{opacity:.35; cursor:not-allowed}
  #q{
    flex:1; background:none; border:0; outline:0; color:var(--ink); font-size:14px;
    font-family:var(--font); padding:7px 0; min-width:0;
  }
  #q::placeholder{color:var(--dimmer)}
  #send{
    flex:0 0 auto; border:1px solid rgba(110,231,255,.3); background:rgba(110,231,255,.1);
    color:var(--accent); font-family:var(--font); font-size:12.5px; font-weight:600; letter-spacing:.04em;
    padding:9px 18px; border-radius:999px; cursor:pointer; transition:.18s;
  }
  #send:hover:not(:disabled){background:rgba(110,231,255,.2)}
  #send:disabled{opacity:.45; cursor:progress}

  /* ---------- boot / error ---------- */
  #boot{
    position:fixed; inset:0; z-index:20; display:grid; place-content:center; gap:14px; text-align:center;
    background:radial-gradient(60% 50% at 50% 50%, #070b18 0%, #03040a 100%);
    transition:opacity .7s ease; padding:24px;
  }
  #boot.gone{opacity:0; pointer-events:none}
  #boot .mark{font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent)}
  #boot .msg{font-size:13px; color:var(--dim); max-width:520px; line-height:1.6}
  #boot .orb{
    width:52px;height:52px;margin:0 auto 6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #9df1ff, #2b6cff 55%, #3a1b7a);
    box-shadow:0 0 42px rgba(110,231,255,.5); animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.09);opacity:1}}
  #boot code{font-family:var(--mono); font-size:12px; color:var(--warn); background:rgba(255,196,107,.08);
    border:1px solid rgba(255,196,107,.2); border-radius:6px; padding:2px 6px}
  .spin{display:inline-block; animation:spin 3.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    #voice-status{align-self:flex-start}
    #voice-detail{max-width:26ch}
    #hud{max-width:none; right:18px; top:12px; left:12px; padding:11px 13px}
    #legend{display:none}
    #hint{display:none}
    #ask-wrap{bottom:14px; width:calc(100vw - 24px)}
    #stage{inset:0}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="grade"></div>

<!-- HUD -->
<div id="hud">
  <h1>Alfred <em>&middot;</em> Knowledge Galaxy</h1>
  <p id="stats">booting&hellip;</p>
  <div id="status"><span class="dot"></span><span id="status-text">starting renderer</span></div>
  <div id="legend"></div>
  <div id="hint">
    drag to orbit &middot; scroll to zoom &middot; click a star for its note &middot; <kbd>/</kbd> to ask
  </div>
  <div id="key-note" hidden></div>
</div>

<!-- side panel -->
<aside id="panel" aria-hidden="true" aria-label="Note detail">
  <button id="panel-close" title="Close (Esc)" aria-label="Close">&#10005;</button>
  <div id="panel-head">
    <h2 id="panel-label">&nbsp;</h2>
    <div id="panel-group"></div>
  </div>
  <div id="panel-body">
    <div class="p-section" style="margin-top:0">
      <div class="p-title">Excerpt</div>
      <p id="panel-excerpt"></p>
    </div>
    <div class="p-section">
      <div class="p-title" id="neigh-title">Connected notes</div>
      <div id="panel-neighbours"></div>
    </div>
    <div id="panel-meta"></div>
  </div>
</aside>

<!-- ask bar -->
<div id="ask-wrap">
  <!-- who does the machine think is talking -->
  <div id="voice-status" data-state="idle">
    <span class="vs-dot"></span>
    <span id="voice-text">idle</span>
    <span id="voice-detail"></span>
  </div>
  <div id="answer" hidden>
    <div class="a-head"><span class="who" id="a-who">Alfred</span><span id="a-model"></span>
      <button id="a-close" title="Dismiss" aria-label="Dismiss">&#10005;</button></div>
    <div id="answer-text"></div>
    <div id="answer-sources"></div>
    <div class="a-foot" id="a-foot"></div>
  </div>
  <form id="ask-form" autocomplete="off">
    <span class="sig"></span>
    <button id="mic" type="button" aria-pressed="false" aria-label="Start listening"
            title="Talk to your notes (click to start, click again to stop)">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v5.5A3.5 3.5 0 0 0 12 15z"
              fill="currentColor"/>
        <path d="M6.5 11.5a.9.9 0 0 1 1.8 0 3.7 3.7 0 0 0 7.4 0 .9.9 0 0 1 1.8 0 5.5 5.5 0 0 1-4.6 5.4v2.2h2.2a.9.9 0 0 1 0 1.8H9.9a.9.9 0 0 1 0-1.8h1.2v-2.2a5.5 5.5 0 0 1-4.6-5.4z"
              fill="currentColor"/>
      </svg>
    </button>
    <input id="q" type="text" placeholder="Ask your notes&hellip;" aria-label="Ask your notes" maxlength="500">
    <button id="speak-toggle" type="button" aria-pressed="true"
            aria-label="Spoken answers" title="Spoken answers on (click to silence)">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M4 9.5h3.2L11.5 6v12L7.2 14.5H4z" fill="currentColor"/>
        <path class="wave" d="M14.8 8.6a4.6 4.6 0 0 1 0 6.8" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"/>
        <path class="wave" d="M17.2 6.2a7.8 7.8 0 0 1 0 11.6" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="send" type="submit">Ask</button>
  </form>
</div>

<!-- boot overlay -->
<div id="boot">
  <div class="orb"></div>
  <div class="mark">Alfred</div>
  <div class="msg" id="boot-msg">Igniting the galaxy&hellip;</div>
</div>

<script src="graph-data.js"></script>
<script type="module">
/* ============================================================================
   Alfred - knowledge galaxy viewer
   No npm, no build step, no framework. Everything below is plain ES modules +
   the 3d-force-graph bundle from a CDN.
   ========================================================================== */

const CFG = {
  // Pinned on purpose. The 3d-force-graph bundle is built against three.js r183
  // and reuses window.THREE when it is already defined, so we hand it that exact
  // revision. Three is loaded first, and only then the bundle.
  //   three.module.min.js imports ./three.core.min.js - a plain relative import,
  //   so no import map is involved and the CDN serves both files.
  // Each list is tried in order; ./vendor/* is an optional offline copy created
  // by tools/vendor.py for networks that cannot reach a CDN at all.
  three: [
    'https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.min.js',
    './vendor/three.module.min.js'
  ],
  graph: [
    'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js',
    'https://unpkg.com/3d-force-graph@1.80.0/dist/3d-force-graph.min.js',
    './vendor/3d-force-graph.min.js'
  ],
  idleDelay: 7000,       // ms of no interaction before the slow drift resumes
  flyMs: 1300,
  haloScale: 7.2,
  nodeRelSize: 2.1
};

/* ===========================================================================
   VOICE - speaking and listening using only what the browser already has.
   No paid services anywhere: Web Speech API (speechSynthesis) for talking and
   webkitSpeechRecognition for listening.
   =========================================================================== */

// The wait, in milliseconds, after the last recognised word before we treat the
// thought as finished. Speech recognition finalises a phrase at every pause and
// people pause mid-sentence, so fragments are buffered and this window stitches
// them back together. THIS IS THE ONLY PLACE THE WAIT IS DEFINED.
const FINISH_MS = 900;

// Words that must not wait for the finish window - they act the moment they are heard.
const INTERRUPT_WORDS = ['stop', 'wait', 'hold on', 'cancel', 'quiet', 'never mind', 'shut up'];

// Listening language. Indian English suits this accent and the Hindi words in these
// notes; set it to 'en-GB' or 'en-US' if you would rather.
const RECOGNITION_LANG = 'en-IN';

// Spoken answers prefer a British English voice when the system has one, then any
// English voice, then whatever the system offers.
const VOICE_LANGS = [/en[-_]GB/i, /en[-_]UK/i, /^en\b/i];
const VOICE_NAMES = /daniel|serena|kate|arthur|sonia|libby|george|oliver|ryan|amelie|british|uk english/i;

// ?mute=1 silences the whole tab. Read once here and enforced inside speak(),
// so nothing can route around it.
const MUTED_BY_URL = /(?:^|[?&])mute=1(?:&|$)/.test(window.location.search);

const $ = (id) => document.getElementById(id);
const stage = $('stage');
const boot = $('boot');
const bootMsg = $('boot-msg');

/* ---------------------------------------------------------------- utilities */
const PALETTE = ['#5ee7ff','#a98bff','#ffb45c','#5cffc0','#ff6ea9','#d4ff5c',
                 '#7db8ff','#ff8f6e','#4fd8c8','#ffd76e','#8f9dff','#ff7bd5'];

function groupColors(nodes){
  const groups = [...new Set(nodes.map(n => n.group || 'notes'))].sort();
  const map = {};
  groups.forEach((g,i) => map[g] = PALETTE[i % PALETTE.length]);
  return map;
}
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mix(hex, target, t){
  const a = hexToRgb(hex), b = hexToRgb(target);
  return '#' + a.map((v,i)=> Math.round(v + (b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const dim = (hex) => mix(hex, '#1b2233', 0.72);   // dimmed = pulled toward the void
const hot = (hex) => mix(hex, '#ffffff', 0.42);   // lit = pulled toward white
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function loadScript(urls){
  return new Promise((resolve, reject) => {
    const tried = [];
    let i = 0;
    const next = () => {
      if (i >= urls.length) {
        const err = new Error('could not load the 3D engine from any source');
        err.tried = tried;
        return reject(err);
      }
      const url = urls[i++];
      tried.push(url);
      const s = document.createElement('script');
      s.src = url;
      s.async = false;
      s.onload = () => { s.dataset.src = url; resolve(url); };
      s.onerror = () => {
        console.warn('[alfred] script not available:', url);
        s.remove();
        next();
      };
      document.head.appendChild(s);
    };
    next();
  });
}

async function loadThree(){
  for (const url of CFG.three){
    try {
      const mod = await import(url);
      if (mod && mod.REVISION) return mod;
    } catch (err){
      console.warn('[alfred] three.js not available at', url, '-', err.message);
    }
  }
  return null;
}

/* --------------------------------------------------------------- graph data */
const GRAPH = (typeof window.GRAPH !== 'undefined' && window.GRAPH) || {nodes:[], links:[]};
const NODES = GRAPH.nodes || [];
const LINKS = GRAPH.links || [];

if (!NODES.length){
  boot.classList.remove('gone');
  bootMsg.innerHTML = 'No notes indexed yet. Run <code>python3 build.py</code> to write ' +
                      '<code>viewer/graph-data.js</code>, then reload.';
  $('stats').textContent = 'empty galaxy';
  throw new Error('no graph data');
}

// links arrive as indexes -> resolve to node objects once, keep both views
const byIndex = new Map(NODES.map((n,i) => [n.index != null ? n.index : i, n]));
const linkObjs = [];
const adj = new Map(NODES.map(n => [n.id, []]));
LINKS.forEach(l => {
  const s = byIndex.get(l.source), t = byIndex.get(l.target);
  if (!s || !t) return;
  const link = {source: s, target: t, kind: l.kind || 'link', weight: l.weight || 1};
  linkObjs.push(link);
  adj.get(s.id).push({node: t, link});
  adj.get(t.id).push({node: s, link});
});
const COLORS = groupColors(NODES);
const nodesById = new Map(NODES.map(n => [n.id, n]));

/* --------------------------------------------------------------- 3d layer */
let Graph = null, THREE = null, camera = null, controls = null;
let halos = new Map();          // node id -> halo sprite
let starfield = null, core = null;
let camRadius = 420;            // camera distance from the centre, set after layout
let litIds = new Set(), litPair = new Set();
let selected = null;            // currently focused node
let lastFlyTo = null;           // destination of the most recent camera flight
let hoveredId = null;
let domainNodes = null;         // set when filtering by group

/* -- sprites are built from tiny canvases so we need no extra assets -------- */
function radialTexture(stops, size = 128){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(([at, color]) => g.addColorStop(at, color));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}
function starTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.35,'rgba(255,255,255,.75)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}

function makeStarfield(count = 5200){
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++){
    // uniform shell, so stars never bunch at the poles
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const r = 900 + Math.pow(Math.random(), 0.6) * 2600;
    const s = Math.sqrt(1 - u * u);
    pos[i*3] = r * s * Math.cos(th);
    pos[i*3+1] = r * u;
    pos[i*3+2] = r * s * Math.sin(th);
    const warm = Math.random();
    c.setHSL(warm < 0.72 ? 0.58 : (warm < 0.9 ? 0.09 : 0.78), 0.45, 0.72 + Math.random() * 0.25);
    const k = 0.35 + Math.random() * 0.65;
    col[i*3] = c.r * k; col[i*3+1] = c.g * k; col[i*3+2] = c.b * k;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 2.1,
    sizeAttenuation: false,        // pixel-sized: identical on every zoom level
    map: starTexture(),
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = -2;
  return pts;
}

function makeCoreGlow(){
  const g = new THREE.Group();
  const tex = radialTexture([[0,'rgba(255,255,255,.85)'],[0.25,'rgba(160,190,255,.35)'],[1,'rgba(0,0,0,0)']], 256);
  [[0x2b6cff, 640, .16, [0,0,-120]], [0x7a3cff, 900, .12, [140,-90,180]]].forEach(([hex, scale, opacity, p]) => {
    const mat = new THREE.SpriteMaterial({
      map: tex, color: hex, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const s = new THREE.Sprite(mat);
    s.scale.set(scale, scale, 1);
    s.position.set(p[0], p[1], p[2]);
    s.renderOrder = -1;
    g.add(s);
  });
  return g;
}

const nodeVal = (n) => 2.6 + Math.min(3.4, (n.words || 40) / 90);
const sphereR = (n) => CFG.nodeRelSize * Math.cbrt(nodeVal(n));
const colorOf = (n) => COLORS[n.group] || '#8fa2c0';

function makeHalo(n){
  const base = colorOf(n);
  const mat = new THREE.SpriteMaterial({
    map: haloTex, color: base, transparent: true, opacity: .55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const spr = new THREE.Sprite(mat);
  spr.scale.setScalar(sphereR(n) * CFG.haloScale);
  spr.userData.nodeId = n.id;
  halos.set(n.id, spr);
  return spr;
}
let haloTex = null;

/* -- visual state --------------------------------------------------------- */
function styleFor(n){
  const base = colorOf(n);
  const isSel = selected && n.id === selected.id;
  const lit = litIds.has(n.id);
  const filtered = domainNodes && !domainNodes.has(n.id);
  if (isSel)       return {color:'#ffffff', halo:hot(base), haloOp:.95, scale:1.55};
  if (lit)         return {color:hot(base), halo:hot(base), haloOp:.8,  scale:1.15};
  if (filtered)    return {color:dim(base), halo:dim(base), haloOp:.12, scale:.85};
  return {color:base, halo:base, haloOp:.5, scale:1};
}

function repaintNodes(){
  NODES.forEach(n => {
    const st = styleFor(n);
    const spr = halos.get(n.id);
    if (spr){
      spr.material.color.set(st.halo);
      spr.material.opacity = st.haloOp;
      spr.scale.setScalar(sphereR(n) * CFG.haloScale * st.scale);
    }
  });
  if (Graph){
    Graph.nodeColor(Graph.nodeColor());                      // documented refresh idiom
    Graph.linkColor(Graph.linkColor());
    Graph.linkWidth(Graph.linkWidth());
    Graph.linkDirectionalParticles(Graph.linkDirectionalParticles());
  }
}
function linkIsLit(l){ return litPair.has(l.source.id + '|' + l.target.id) || litPair.has(l.target.id + '|' + l.source.id); }

function setFocus(node){
  selected = node;
  domainNodes = null;
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  litIds = new Set([node.id]);
  litPair = new Set();
  (adj.get(node.id) || []).forEach(({node:n2, link}) => {
    litIds.add(n2.id);
    litPair.add(link.source.id + '|' + link.target.id);
  });
  repaintNodes();
  openPanel(node);
  flyTo(node);
}
function setDomain(group){
  selected = null;
  litPair = new Set();
  if (!group){ domainNodes = null; litIds = new Set(); }
  else {
    domainNodes = new Set(NODES.filter(n => n.group === group).map(n => n.id));
    litIds = new Set(domainNodes);
  }
  repaintNodes();
  closePanel();
}
function clearFocus(){
  selected = null; domainNodes = null; litIds = new Set(); litPair = new Set();
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  repaintNodes();
  closePanel();
}

/* -- camera --------------------------------------------------------------- */
function flyTo(node){
  if (!Graph) return;
  flyingUntil = performance.now() + CFG.flyMs + 400;   // hold the drift off
  markActivity();                                      // and stop it right now
  // Approach distance scales with the node's own neighbourhood, not with the size
  // of the whole galaxy - otherwise a click on a small cluster ends up staring at
  // it from across the map. Falls back to a fraction of the framed radius.
  const neigh = adj.get(node.id) || [];
  let scale = 0;
  neigh.forEach(({node: n2}) => {
    if (n2.x == null) return;
    scale += Math.hypot(n2.x - node.x, n2.y - node.y, n2.z - node.z);
  });
  scale = neigh.length ? scale / neigh.length : 0;
  const d = Math.max(70, Math.min(camRadius * 0.5, scale ? scale * 2.1 : camRadius * 0.24));

  const nx = node.x || 0, ny = node.y || 0, nz = node.z || 0;
  const dist = Math.hypot(nx, ny, nz) || 1;
  const camPos = {x: nx * (1 + d / dist), y: ny * (1 + d / dist), z: nz * (1 + d / dist)};

  // The side panel covers the right-hand third of the screen. Pan the camera so the
  // node we just flew to sits in the middle of what is actually visible, instead of
  // hiding behind the panel.
  const pan = panelPanOffset(nx, ny, nz, camPos, d);
  const target = {x: nx + pan.x, y: ny + pan.y, z: nz + pan.z};

  Graph.cameraPosition({x: camPos.x + pan.x, y: camPos.y + pan.y, z: camPos.z + pan.z},
                       target, CFG.flyMs);
  if (controls) controls.target.set(target.x, target.y, target.z);
  // where this flight is headed - handy for tests and for debugging
  lastFlyTo = {pos: {x: camPos.x + pan.x, y: camPos.y + pan.y, z: camPos.z + pan.z},
               target: target, node: {x: nx, y: ny, z: nz}, distance: d, at: performance.now()};
}

function panelPanOffset(nx, ny, nz, camPos, d){
  const none = {x: 0, y: 0, z: 0};
  if (!panel || !panel.classList.contains('open')) return none;
  const viewportW = window.innerWidth || 1;
  const panelW = panel.getBoundingClientRect().width;
  const visibleW = Math.max(120, viewportW - panelW);
  if (panelW <= 0 || visibleW >= viewportW - 1) return none;
  // how far left of screen centre the node must appear, in pixels
  const shiftPx = panelW / 2;
  const screenW = 2 * d * Math.tan((((camera && camera.fov) || 50) * Math.PI / 180) / 2) * (viewportW / (window.innerHeight || 1));
  const world = (shiftPx / viewportW) * screenW;
  // camera "right" is cross(up, backward) with up = +Y, so (b_z, 0, -b_x) - moving the
  // camera that way slides the subject to the left on screen
  const bx = camPos.x - nx, by = camPos.y - ny, bz = camPos.z - nz;
  const bl = Math.hypot(bx, by, bz) || 1;
  const rx = bz / bl, ry = 0, rz = -bx / bl;
  const rl = Math.hypot(rx, ry, rz) || 1;
  return {x: (rx / rl) * world, y: (ry / rl) * world, z: (rz / rl) * world};
}
function measureGalaxy(){
  try {
    const bb = Graph.getGraphBbox();
    const span = bb ? Math.max(
      (bb.x[1] - bb.x[0]) || 0, (bb.y[1] - bb.y[0]) || 0, (bb.z[1] - bb.z[0]) || 0) : 0;
    camRadius = Math.min(1600, Math.max(240, span * 1.55));
  } catch (err){ camRadius = 420; }
  return camRadius;
}

function resetCamera(animate = 1200){
  if (!Graph) return;
  Graph.cameraPosition({x: 0, y: camRadius * 0.22, z: camRadius}, {x: 0, y: 0, z: 0}, animate);
  if (controls) controls.target.set(0, 0, 0);
}

/* -- idle drift ----------------------------------------------------------- */
let lastTouch = 0;
let flyingUntil = 0;
function markActivity(){
  lastTouch = performance.now();
  if (controls && controls.autoRotate) controls.autoRotate = false;
}
function tickIdle(){
  if (!controls) return;
  // never let the idle drift run while a camera flight is in progress: the two
  // both write camera.position and the drift wins, which makes a click look dead
  const busy = performance.now() < flyingUntil;
  const idle = !busy && performance.now() - lastTouch > CFG.idleDelay;
  if (idle !== controls.autoRotate) controls.autoRotate = idle;
  requestAnimationFrame(tickIdle);
}

/* -- panel ---------------------------------------------------------------- */
const panel = $('panel');
function openPanel(node){

$('panel-close').onclick = () => clearFocus();

/* -- legend --------------------------------------------------------------- */
function buildLegend(){
  const counts = {};
  NODES.forEach(n => counts[n.group] = (counts[n.group] || 0) + 1);
  const box = $('legend');
  box.innerHTML = '';
  Object.keys(counts).sort().forEach(g => {

    el.className = 'chip';
    el.innerHTML = `<i style="background:${COLORS[g]};box-shadow:0 0 8px ${COLORS[g]}"></i>${esc(g)} <span class="n">${counts[g]}</span>`;
    el.onclick = () => {

      if (on) clearFocus(); else { el.classList.add('on'); setDomain(g); }
    };
    box.appendChild(el);
  });
}

/* -- picking: works even when the click lands on a node's glow sprite ------ */
function nearestNodeToScreen(clientX, clientY, maxPx = 72){
  if (!THREE || !camera) return null;
  const rect = Graph.renderer().domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  const tanHalfFov = Math.tan((camera.fov * Math.PI / 180) / 2);
  let best = null, bestScore = Infinity;
  NODES.forEach(n => {
    if (n.x == null) return;
    p.set(n.x, n.y, n.z);
    const along = p.clone().sub(ray.ray.origin).dot(ray.ray.direction);
    if (along <= 0) return;                              // behind the camera
    const perp = ray.ray.distanceToPoint(p);
    const offsetPx = (perp / along) * (rect.height / (2 * tanHalfFov));  // true screen distance
    if (offsetPx > maxPx) return;                        // too far off the cursor
    const score = along * 0.001 + offsetPx;              // prefer the nearest thing to the cursor
    if (score < bestScore){ bestScore = score; best = n; }
  });
  return best;
}
let downPos = null, dragDist = 0;
stage.addEventListener('pointerdown', (e) => { downPos = [e.clientX, e.clientY]; dragDist = 0; markActivity(); }, true);
stage.addEventListener('pointermove', (e) => {
  if (downPos) dragDist = Math.max(dragDist, Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]));
}, true);
stage.addEventListener('pointerup', () => { markActivity(); }, true);
stage.addEventListener('wheel', markActivity, {passive: true});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ if (panel.classList.contains('open')) clearFocus(); else resetCamera(); }
  if (e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
  markActivity();
});

/* ------------------------------------------------------------------ boot */
async function boot3d(){
  bootMsg.textContent = 'Loading the renderer…';
  THREE = await loadThree();
  if (THREE) {
    // The bundle renders through this same instance. Importing three.js makes it
    // set window.__THREE__, so the bundle's own bundled copy prints a one-line
    // "Multiple instances of Three.js" warning on load. It is harmless: the
    // internal copy is never used once window.THREE exists.
    window.THREE = THREE;
  } else {
    console.warn('[alfred] no three.js available - falling back to the copy inside the bundle');
  }

  const built = await loadScript(CFG.graph);
  bootMsg.textContent = 'Building the galaxy…';

  const ForceGraph3D = window.ForceGraph3D;
  if (typeof ForceGraph3D !== 'function') throw new Error('3d-force-graph did not load');

  if (THREE){
    haloTex = radialTexture([[0,'rgba(255,255,255,1)'],[0.18,'rgba(255,255,255,.85)'],
                             [0.45,'rgba(255,255,255,.28)'],[1,'rgba(255,255,255,0)']]);
  } else {
    console.warn('[alfred] shared three.js unavailable - the bundle will use its own copy ' +
                 'and the glow sprites / starfield will be skipped');
  }

  Graph = new ForceGraph3D(stage, {controlType: 'orbit'})
    .backgroundColor('#03040a')
    .showNavInfo(false)
    .nodeId('id')
    .nodeRelSize(CFG.nodeRelSize)
    .nodeVal(nodeVal)
    .nodeOpacity(1)
    .nodeResolution(16)
    .nodeColor(n => styleFor(n).color)
    .nodeLabel(n => `<b>${esc(n.label)}</b><br><span>${esc(n.group)} &middot; ${(adj.get(n.id)||[]).length} links</span>`)
    .linkSource('source').linkTarget('target')
    .linkColor(l => linkIsLit(l) ? '#cdeeff' : '#3d5578')
    .linkWidth(l => linkIsLit(l) ? 1.35 : 0.35)
    .linkOpacity(0.45)
    .linkCurvature(0.12)
    .linkDirectionalParticles(l => linkIsLit(l) ? 2 : 0)
    .linkDirectionalParticleWidth(1.5)
    .linkDirectionalParticleSpeed(0.0065)
    .linkDirectionalParticleColor(() => '#dff6ff')
    .warmupTicks(40)
    .cooldownTicks(220)
    .cooldownTime(9000)
    .d3AlphaDecay(0.019)
    .d3VelocityDecay(0.33)
    .onNodeClick((n) => { if (dragDist < 6) setFocus(n); })
    .onBackgroundClick((e) => {
      // also fires for clicks that land on a node's glow sprite, so fall back to a raycast
      if (dragDist >= 6) return;
      const hit = nearestNodeToScreen(e.clientX, e.clientY);
      if (hit) setFocus(hit); else clearFocus();
    });

  // settle geometry the library keeps private
  try {
    const charge = Graph.d3Force('charge');
    if (charge && charge.strength) charge.strength(-135);
    const link = Graph.d3Force('link');
    if (link && link.distance) link.distance(n => 34 + (n.degree || 0) * 3);
  } catch (err){ console.warn('[alfred] could not tune forces', err); }

  Graph.graphData({nodes: NODES, links: linkObjs});

  camera = Graph.camera();
  camera.far = 45000;                      // room for the starfield shell
  camera.near = 1.5;                        // keeps depth precision sane at that far plane
  camera.updateProjectionMatrix();
  camera.position.set(0, 0, 520);

  controls = Graph.controls ? Graph.controls() : null;
  if (controls){
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotateSpeed = 0.42;       // the slow idle drift
    controls.zoomSpeed = 0.8;
    controls.minDistance = 26;
    controls.maxDistance = 4200;
  }
  lastTouch = performance.now();
  requestAnimationFrame(tickIdle);

  if (THREE){
    const scn = Graph.scene();
    starfield = makeStarfield(5200);
    core = makeCoreGlow();
    scn.add(starfield);
    scn.add(core);
    halos.clear();
    Graph.nodeThreeObject(n => makeHalo(n));
    Graph.nodeThreeObjectExtend(true);     // keep the solid core, add the glow
    // the bundle ships AmbientLight(0xcccccc, PI) + DirectionalLight(0xffffff, 0.6*PI);
    // scale from those rather than replacing them
    const lights = Graph.lights();
    if (lights && lights[0]) lights[0].intensity = Math.PI * 1.15;
    if (lights && lights[1]) lights[1].intensity = 0.6 * Math.PI * 1.25;
  } else {
    console.warn('[alfred] running without the shared three.js - glow sprites and starfield are off');
  }

  repaintNodes();
  buildLegend();
  $('stats').textContent = `${NODES.length} notes · ${linkObjs.length} links · ` +
                           `${Object.keys(COLORS).length} groups`;

  // Frame the whole galaxy once the layout settles - but only while the viewer has
  // not taken the camera anywhere itself. On a slow machine (or a big vault) the
  // simulation can still be cooling for many seconds after load, and without this
  // guard the auto-frame fires *after* a click and drags the camera away from the
  // note the user just flew to.
  Graph.onEngineStop(() => {
    measureGalaxy();
    if (!selected && !lastFlyTo){
      resetCamera(1600);
    } else {
      console.log('[alfred] layout settled; leaving the camera where the viewer put it');
    }
    setTimeout(verifyRender, 900);
  });

  // tell the user straight away if the brain has no key yet
  fetch('/health').then(r => r.ok ? r.json() : null).then(h => {
    if (!h || !h.key || h.key.state === 'set') return;
    const note = $('key-note');
    if (!note) return;
    note.textContent = h.key.state === 'missing'
      ? 'No API key in config.json - the galaxy works, the brain is asleep.'
      : 'config.json still holds the placeholder key - paste your real one and restart server.py to wake the brain.';
    note.hidden = false;
  }).catch(() => {});

  // fade the boot overlay out as soon as we have actually drawn frames
  setTimeout(() => boot.classList.add('gone'), 400);
  window.__alfred = {graph: Graph, data: GRAPH, selfTest: verifyRender, focus: setFocus,
                     reset: clearFocus, loadScript, loadThree, CFG,
                     camRadius: () => camRadius, lastFlyTo: () => lastFlyTo,
                     layoutStable: () => !Graph || Graph.graphData().nodes.every(n => n.fx === undefined),
                     // voice, exposed for the test suites and for debugging
                     voice: {
                       FINISH_MS, INTERRUPT_WORDS, RECOGNITION_LANG, MUTED_BY_URL,
                       speak, startListening, stopListening,
                       status: () => voiceState,
                       detail: () => (voiceDetailEl ? voiceDetailEl.textContent : ''),
                       label: () => (voiceTextEl ? voiceTextEl.textContent : ''),
                       buffer: () => pendingUtterance,
                       isListening: () => listening,
                       wantsListening: () => wantListening,
                       chosenVoice: () => chosenVoice,
                       voices: () => voices,
                       lastSpoken: () => lastSpoken,
                       isUnlocked: () => unlocked,
                       setSpeaker: (on) => { speakerOn = !!on; return speakerOn; },
                       submitQuestion,
                       // test seam: lets a suite drive recognition events directly
                       _hooks: {
                         final: onFinalFragment, interim: onInterimFragment,
                         interrupt: interruptNow, finish: finishAndSend
                       }
                     }};
}

/* -- in-browser health check: is the renderer really drawing? -------------- */
function verifyRender(){
  const out = {notes: NODES.length, links: linkObjs.length, three: null, webgl: null,
               drawCalls: null, sceneChildren: null, starfield: null, ok: false};
  try {
    const r = Graph.renderer();
    const gl = r.getContext();
    out.webgl = gl ? (gl.getParameter(gl.VERSION) || 'yes') : 'no context';
    out.three = (THREE && THREE.REVISION) || (window.__THREE__ ? String(window.__THREE__) : 'bundled');
    out.drawCalls = r.info.render.calls;
    out.sceneChildren = Graph.scene().children.length;
    out.starfield = !!(starfield && starfield.parent);
    out.cameraFar = camera ? camera.far : null;
    out.ok = out.drawCalls > 0;
  } catch (err){
    out.error = String(err);
  }
  const el = $('status'), txt = $('status-text');
  if (out.ok){
    el.className = 'live';
    txt.textContent = `live · ${out.drawCalls} draw calls · three r${out.three}`;
  } else {
    el.className = 'bad';
    txt.textContent = 'renderer not drawing — open the console';
  }
  console.log('[alfred] self-test', out);
  return out;
}

/* ======================= voice: the machine talking and listening ========= */

const voiceEl = $('voice-status'), voiceTextEl = $('voice-text'), voiceDetailEl = $('voice-detail');
const micBtn = $('mic'), speakBtn = $('speak-toggle');

let voiceState = 'idle';
let lastSpoken = null;
let speakerOn = true;
let unlocked = false;              // has the user interacted yet?
let pendingSpeech = null;          // something queued before the first click
let voices = [];
let chosenVoice = null;

function setVoiceStatus(state, detail){
  voiceState = state;
  if (!voiceEl) return;
  voiceEl.dataset.state = state;
  const labels = {
    idle: "idle \u00b7 ask me something",
    listening: "listening \u00b7 you're talking",
    thinking: "thinking \u00b7 reading your notes",
    speaking: "speaking \u00b7 alfred is talking",
    muted: "muted \u00b7 this tab never speaks",
    stopped: "stopped \u00b7 not listening",
    error: "can't listen here"
  };
  voiceTextEl.textContent = labels[state] || state;
  let note = detail || '';
  if (MUTED_BY_URL && state !== 'muted'){
    note = (note ? note + ' \u00b7 ' : '') + '?mute=1 \u00b7 silent';
  }
  voiceDetailEl.textContent = note;
  if (micBtn) micBtn.setAttribute('aria-pressed', state === 'listening' ? 'true' : 'false');
}

/* ---- voices ------------------------------------------------------------- */
function refreshVoices(){
  const synth = window.speechSynthesis;
  voices = (synth && synth.getVoices && synth.getVoices()) || [];
  chosenVoice = chooseVoice(voices);
  return chosenVoice;
}
function chooseVoice(list){
  if (!list || !list.length) return null;
  for (const re of VOICE_LANGS){
    const hit = list.find(v => re.test(v.lang || '') || re.test(v.name || ''));
    if (hit) return hit;
  }
  const hinted = list.find(v => VOICE_NAMES.test(v.name || ''));
  return hinted || list[0] || null;
}
if (window.speechSynthesis){
  refreshVoices();
  if (window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
  } else {
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
}

function forSpeech(text){
  return String(text == null ? '' : text)
    .replace(/[#*_`>\[\]]/g, '')      // stray markdown
    .replace(/\u2026/g, '...')
    .replace(/\s+/g, ' ')
    .trim();
}

/* ---- the one function that speaks -------------------------------------- */
function speak(text){
  // THE mute gate. Checked here and nowhere else, so no code path can talk
  // around it: a ?mute=1 tab is silent no matter who asks.
  if (MUTED_BY_URL){
    setVoiceStatus('muted', '?mute=1 \u00b7 nothing in this tab will speak');
    return Promise.resolve(false);
  }
  if (!speakerOn){
    setVoiceStatus('idle', 'spoken answers off');
    return Promise.resolve(false);
  }
  const synth = window.speechSynthesis;
  const Utter = window.SpeechSynthesisUtterance;
  if (!synth || !Utter){
    setVoiceStatus('idle', 'this browser cannot speak');
    return Promise.resolve(false);
  }
  const clean = forSpeech(text);
  if (!clean) return Promise.resolve(false);

  // Browsers refuse to play audio until the user has interacted. Hold the line
  // instead of dropping it, and unlockSpeech() will say it after the first click.
  if (!unlocked){
    pendingSpeech = clean;
    setVoiceStatus('idle', 'waiting for your first click');
    return Promise.resolve(false);
  }

  try { synth.cancel(); } catch (err) { /* nothing was queued */ }

  let u;
  try {
    u = new Utter(clean);
  } catch (err){
    setVoiceStatus('error', 'this browser could not build a spoken line');
    return Promise.resolve(false);
  }
  const v = chosenVoice || refreshVoices();
  // Setting .voice throws on some platforms when the object the browser handed us
  // is not a real SpeechSynthesisVoice. Losing the accent is fine; losing the
  // answer is not, so fall back to the language tag and carry on.
  if (v){
    try {
      u.voice = v;
      u.lang = v.lang || 'en-GB';
    } catch (err){
      u.lang = (v && v.lang) || 'en-GB';
      setVoiceStatus('speaking', 'voice not assignable here - using the default');
    }
  } else {
    u.lang = 'en-GB';
  }
  u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;

  return new Promise((resolve) => {
    let settled = false;
    let guard = null;
    const done = (spoken) => {
      if (settled) return;
      settled = true;
      clearTimeout(guard);
      if (!listening) setVoiceStatus('idle', spoken ? 'your turn' : '');
      resumeIfHandsFree();
      resolve(spoken);
    };
    // Safety net: a few platforms report the end of an utterance late, or never.
    // Without this the status line would sit on "speaking" and the ask button would
    // never re-enable.
    guard = setTimeout(() => {
      setVoiceStatus('idle', 'speech timed out');
      try { synth.cancel(); } catch (err) { /* nothing playing */ }
      done(false);
    }, Math.max(4000, clean.length * 90 + 2000));
    u.onstart = () => {
      lastSpoken = clean;
      setVoiceStatus('speaking', v ? (v.name + ' \u00b7 ' + v.lang) : 'system voice');
    };
    u.onend = () => done(true);
    u.onerror = (e) => {
      setVoiceStatus('idle', 'speech failed: ' + ((e && e.error) || 'unknown'));
      done(false);
    };
    try {
      synth.speak(u);
    } catch (err){
      setVoiceStatus('idle', 'speech failed: ' + err.message);
      done(false);
    }
  });
}

// Hands-free: if the question came in by voice, open the mic again once Alfred has
// finished talking, so the conversation can carry on without touching anything.
function resumeIfHandsFree(){
  if (resumeListeningAfterSpeech){
    resumeListeningAfterSpeech = false;
    startListening();
  }
}

/* ---- unlocking audio on the first user gesture -------------------------- */
function unlockSpeech(){
  if (unlocked) return;
  unlocked = true;
  // A muted tab does not touch the speech engine at all - not even the silent
  // priming utterance below, which would otherwise be a way around the gate.
  if (MUTED_BY_URL){
    setVoiceStatus('muted', '?mute=1 \u00b7 nothing in this tab will speak');
    return;
  }
  // Prime the engine inside the gesture that unlocked it; some browsers need a
  // silent utterance before they will play a real one later.
  const synth = window.speechSynthesis;
  if (synth && window.SpeechSynthesisUtterance){
    try {
      const primer = new window.SpeechSynthesisUtterance(' ');
      primer.volume = 0;
      synth.speak(primer);
      synth.cancel();
    } catch (err) { /* the engine may be missing entirely - speak() reports it */ }
  }
  refreshVoices();
  if (pendingSpeech){
    const queued = pendingSpeech;
    pendingSpeech = null;
    speak(queued);                     // the first spoken line lands here, after your click
  } else if (voiceState === 'idle'){
    setVoiceStatus('idle', 'ready');
  }
}
window.addEventListener('pointerdown', unlockSpeech, {passive: true});
window.addEventListener('keydown', unlockSpeech, {passive: true});
window.addEventListener('touchstart', unlockSpeech, {passive: true});

/* ---- listening ---------------------------------------------------------- */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let listening = false;          // is the mic on right now?
let wantListening = false;      // should it be on? (auto-restarts across silence)
let lastHeard = '';
let finishTimer = null;         // the FINISH_MS window
let pendingUtterance = '';      // what we have buffered but not yet sent
let restartTimer = null;
let dispatchedInThisTurn = false;
let resumeListeningAfterSpeech = false;   // hands-free: keep the conversation going

function isInterrupt(text){
  const bare = String(text || '').toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
  return INTERRUPT_WORDS.includes(bare);
}
function showBuffer(interim){
  const text = (pendingUtterance + (interim ? (pendingUtterance ? ' ' : '') + interim : '')).trim();
  if (text) input.value = text;
  return text;
}
function short(text, n = 34){
  const t = String(text || '').trim();
  return t.length > n ? t.slice(0, n - 1) + '\u2026' : t;
}

// A finalised fragment: do NOT send. Buffer it and restart the window, so a pause
// in the middle of a sentence does not cut the question in half.
function onFinalFragment(text){
  const clean = String(text || '').trim();
  if (!clean) return;
  if (isInterrupt(clean)) return interruptNow(clean);      // short interrupt words fire now

  pendingUtterance = (pendingUtterance ? pendingUtterance + ' ' : '') + clean;
  showBuffer('');
  clearTimeout(finishTimer);                                // more speech: restart the window
  finishTimer = setTimeout(finishAndSend, FINISH_MS);
  setVoiceStatus('listening', `heard "${short(clean)}" \u00b7 ${FINISH_MS}ms pause to add more`);
}

// Interim results are just a preview, except for interrupt words which must be instant.
function onInterimFragment(text){
  const clean = String(text || '').trim();
  if (!clean) return;
  if (isInterrupt(clean)) return interruptNow(clean);
  showBuffer(clean);
  setVoiceStatus('listening', `hearing "${short(clean)}"`);
}

// The pause that ends the thought: send the whole combined sentence.
function finishAndSend(){
  clearTimeout(finishTimer);
  finishTimer = null;
  const question = pendingUtterance.trim();
  pendingUtterance = '';
  if (!question) return;
  if (isInterrupt(question)) return interruptNow(question);
  resumeListeningAfterSpeech = wantListening;   // hands-free conversation
  stopListening('sent');
  setVoiceStatus('thinking', 'sent: "' + short(question, 46) + '"');
  submitQuestion(question);
}

function interruptNow(word){
  clearTimeout(finishTimer);
  finishTimer = null;
  pendingUtterance = '';
  resumeListeningAfterSpeech = false;
  stopListening('interrupted');
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (err) {} }
  input.value = '';
  setVoiceStatus('stopped', 'heard "' + short(word, 18) + '" \u00b7 cancelled, nothing sent');
}

function makeRecognition(){
  if (!SpeechRecognitionCtor) return null;
  const r = new SpeechRecognitionCtor();
  r.lang = RECOGNITION_LANG;
  r.continuous = true;          // keep going across pauses; we do the stitching
  r.interimResults = true;      // needed to react to "stop" the moment it is said
  r.maxAlternatives = 1;
  r.onstart = () => { listening = true; setVoiceStatus('listening', 'listening\u2026'); };
  r.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++){
      const result = event.results[i];
      const text = (result[0] && result[0].transcript) || '';
      if (result.isFinal){
        onFinalFragment(text);
        dispatchedInThisTurn = dispatchedInThisTurn || false;
      } else {
        interim += text;
      }
    }
    if (interim) onInterimFragment(interim);
  };
  r.onerror = (event) => {
    const code = (event && event.error) || 'unknown';
    if (code === 'no-speech' || code === 'aborted') return;      // normal, the restart handles it
    if (code === 'not-allowed' || code === 'service-not-allowed'){
      wantListening = false;
      setVoiceStatus('error', 'microphone blocked - allow it in the address bar');
      return;
    }
    if (code === 'network'){
      wantListening = false;
      setVoiceStatus('error', 'speech recognition needs a network connection');
      return;
    }
    setVoiceStatus('error', 'listening failed: ' + code);
  };
  r.onend = () => {
    listening = false;
    // Chrome ends the session on silence; restart so the mic stays open until the
    // user switches it off.
    if (wantListening){
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => { if (wantListening) startListening(); }, 220);
    } else if (voiceState === 'listening'){
      setVoiceStatus('idle', '');
    }
  };
  return r;
}

function startListening(){
  if (!SpeechRecognitionCtor){
    setVoiceStatus('error', 'this browser cannot listen - type instead');
    return false;
  }
  if (listening){ setVoiceStatus('listening', 'listening\u2026'); return true; }
  if (!recog) recog = makeRecognition();
  wantListening = true;
  try {
    recog.start();
  } catch (err){
    // calling start() while already started throws; the existing session is fine
    if (!/already started|already_started/i.test(err.message || '')){
      setVoiceStatus('error', 'could not start the microphone: ' + err.message);
      wantListening = false;
      return false;
    }
  }
  listening = true;
  setVoiceStatus('listening', 'listening\u2026');
  return true;
}

function stopListening(detail){
  wantListening = false;
  clearTimeout(restartTimer);
  clearTimeout(finishTimer);
  finishTimer = null;
  if (recog){
    try { recog.stop(); } catch (err) { /* not running */ }
  }
  if (listening) listening = false;
  if (voiceState === 'listening') setVoiceStatus('idle', detail === 'sent' ? 'sent' : '');
}

/* ---- the buttons -------------------------------------------------------- */
setVoiceStatus(MUTED_BY_URL ? 'muted' : 'idle',
               MUTED_BY_URL ? '?mute=1 \u00b7 nothing in this tab will speak' : '');

if (micBtn){
  if (!SpeechRecognitionCtor){
    micBtn.disabled = true;
    micBtn.title = 'This browser cannot listen (no webkitSpeechRecognition)';
    const askForm = $('ask-form');
    if (askForm) askForm.classList.add('unsupported');
    setVoiceStatus('error', 'this browser cannot listen - typing still works');
  } else {
    micBtn.addEventListener('click', () => {
      unlockSpeech();
      if (wantListening || listening){
        stopListening('switched off');
        setVoiceStatus('stopped', 'microphone off');
      } else {
        pendingUtterance = '';
        startListening();
      }
      input.focus();
    });
  }
}
if (speakBtn){
  speakBtn.addEventListener('click', () => {
    speakerOn = !speakerOn;
    speakBtn.setAttribute('aria-pressed', speakerOn ? 'true' : 'false');
    speakBtn.title = speakerOn ? 'Spoken answers on (click to silence)' : 'Spoken answers off (click to enable)';
    if (!speakerOn){
      if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (err) {} }
      setVoiceStatus(MUTED_BY_URL ? 'muted' : 'idle', 'spoken answers off');
    } else if (MUTED_BY_URL){
      setVoiceStatus('muted', '?mute=1 \u00b7 nothing in this tab will speak');
    } else {
      setVoiceStatus('idle', 'spoken answers on');
      speak('Spoken answers on.');
    }
  });
}
/* ------------------------------------------------------------ the brain UI */
const form = $('ask-form'), input = $('q'), send = $('send');
const answerBox = $('answer'), answerText = $('answer-text'),
      answerSrc = $('answer-sources'), answerFoot = $('a-foot'), answerModel = $('a-model');

function showAnswer(){ answerBox.hidden = false; }
function thinking(){
  answerText.className = 'thinking';
  answerText.textContent = 'reading your notes…';
  answerSrc.innerHTML = ''; answerFoot.textContent = ''; answerModel.textContent = '';
  showAnswer();
}
function renderAnswer(data, question){
  answerText.className = '';
  answerText.textContent = data.answer || '(empty answer)';
  answerModel.textContent = data.model ? `· ${data.model}` : '';
  answerSrc.innerHTML = '';
  (data.nodes || []).forEach(idx => {
    const n = byIndex.get(idx);
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'src';
    b.innerHTML = `<i style="background:${colorOf(n)}"></i>${esc(n.label)}<span class="idx">#${idx}</span>`;
    b.onclick = () => setFocus(n);
    answerSrc.appendChild(b);
  });
  const bits = [];
  if (data.turns != null) bits.push(`memory ${data.turns} turn${data.turns === 1 ? '' : 's'}`);
  if (data.model) bits.push(data.model);
  answerFoot.textContent = bits.join(' · ');
  showAnswer();
}
function renderError(msg, hint){
  answerText.className = 'error';
  answerText.textContent = msg + (hint ? '\n\n' + hint : '');
  answerSrc.innerHTML = ''; answerModel.textContent = ''; answerFoot.textContent = '';
  showAnswer();
}
$('a-close').onclick = () => { answerBox.hidden = true; };

/* One path for both input methods: a typed question and a spoken one go through
   exactly the same /chat flow, and every answer is spoken. */
async function submitQuestion(question){
  question = String(question || '').trim();
  if (!question || send.disabled) return;
  send.disabled = true;
  thinking();
  setVoiceStatus('thinking', 'reading your notes\u2026');
  answerBox.hidden = false;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    let data = {};
    try { data = await res.json(); } catch (_){}
    if (!res.ok || data.error){
      const message = data.error || `The brain returned HTTP ${res.status}.`;
      renderError(message, data.hint || '');
      await speak(message);
    } else {
      renderAnswer(data, question);
      input.value = '';
      await speak(data.answer || '');
    }
  } catch (err){
    renderError('Could not reach the server.', String(err));
    await speak('I could not reach the server.');
  } finally {
    send.disabled = false;
    resumeIfHandsFree();
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  // typing is not a hands-free turn: close the mic so it cannot hear Alfred's answer
  resumeListeningAfterSpeech = false;
  if (wantListening || listening) stopListening('typed');
  submitQuestion(input.value);
});

/* rotating placeholder drawn from the actual note titles */
(function rotatePlaceholder(){
  const titles = NODES.map(n => n.label);
  let i = Math.floor(Math.random() * titles.length);
  setInterval(() => {
    if (document.activeElement === input || input.value) return;
    i = (i + 1) % titles.length;
    input.placeholder = `Ask about “${titles[i]}”…`;
  }, 5200);
})();

/* ------------------------------------------------------------------ start */
boot3d().catch(err => {
  console.error('[alfred] boot failed', err);
  boot.classList.remove('gone');
  const tried = (err && err.tried || []).map(u => '<code>' + esc(u) + '</code>').join(', ');
  bootMsg.innerHTML = 'The 3D layer could not start.<br><code>' + esc(err.message || err) + '</code>' +
    (tried ? '<br><br>Tried: ' + tried : '') +
    '<br><br>This page needs a WebGL-capable browser and one-time access to a CDN ' +
    '(cdn.jsdelivr.net). If your network blocks CDNs, run <code>python3 tools/vendor.py</code> ' +
    'once to keep a local copy, then reload. Details are in the browser console.';
  $('status').className = 'bad';
  $('status-text').textContent = 'boot failed';
});
</script>
